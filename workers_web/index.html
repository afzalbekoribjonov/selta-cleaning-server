<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!--
      iPhone uchun muhim: `viewport-fit=cover` bo'lmasa, "Asosiy ekranga
      qo'shish" orqali ochilganda sahifa "notch" va pastdagi home
      indикator zonasiga yoyilmaydi. `user-scalable=no` — input'ga
      bosilganda Safari sahifani avtomatik kattalashtirib yubormasligi
      uchun (bu iOS'da eng ko'p uchraydigan noqulaylik).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="theme-color" content="#5A148C" />
    <meta name="description" content="Selta Cleaning — Ishchi paneli" />

    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS "Asosiy ekranga qo'shish": ilova kabi to'liq ekranda ochiladi -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Selta Ishchi" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Selta Cleaning — Ishchi paneli</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
