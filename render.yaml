# Render Blueprint — Render dashboard'da "New > Blueprint" orqali shu repo
# ulanganda avtomatik o'qiladi. Sir qiymatlar (sync: false) Render'ga qo'lda
# kiritiladi, gitga hech qachon yozilmaydi.
services:
  - type: web
    name: selta-cleaning-server
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # Admin panel — statik SPA sifatida (Vite build). admin.seltacleaning.uz
  # custom domeni Render dashboard'da shu servisga qo'shiladi (DNS CNAME
  # yozuvi domen provayderida qo'lda sozlanadi).
  - type: web
    name: selta-cleaning-admin
    runtime: static
    rootDir: admin_web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_BASE_URL
        value: https://selta-cleaning-server.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
    routes:
      # React Router client-side sahifalash — istalgan yo'l index.html'ga
      # tushishi kerak (aks holda to'g'ridan-to'g'ri /employees kabi
      # manzilga kirishda 404 chiqadi).
      - type: rewrite
        source: /*
        destination: /index.html
